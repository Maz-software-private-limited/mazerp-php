<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760">
  <!-- Background -->
  <rect width="360" height="760" fill="#f1f5f9"/>
  <!-- App Header -->
  <rect width="360" height="54" fill="#0f172a"/>
  <text x="24" y="33" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#94a3b8">‹</text>
  <text x="180" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff">New Invoice</text>
  <rect x="304" y="18" width="48" height="24" rx="7" fill="#2563eb"/>
  <text x="328" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#fff">Save</text>
  <!-- Invoice number card -->
  <rect x="14" y="66" width="332" height="90" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="86" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#94a3b8">INVOICE NUMBER</text>
  <text x="28" y="106" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1e293b">INV-2024-0892</text>
  <line x1="28" y1="116" x2="332" y2="116" stroke="#f1f5f9" stroke-width="1"/>
  <text x="28" y="133" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b">Date: 15 Aug 2024</text>
  <rect x="246" y="120" width="84" height="20" rx="10" fill="#dcfce7"/>
  <text x="288" y="134" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="600" fill="#16a34a">● Paid</text>
  <!-- Customer section -->
  <rect x="14" y="168" width="332" height="82" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="188" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#94a3b8">BILL TO</text>
  <text x="28" y="207" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1e293b">Raj Electronics</text>
  <text x="28" y="222" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b">Main Road, Tirunelveli 627001</text>
  <text x="28" y="237" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b">+91 98765 43210</text>
  <!-- Items label -->
  <text x="14" y="274" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1e293b">Items</text>
  <!-- Item 1 -->
  <rect x="14" y="282" width="332" height="58" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="294" width="8" height="8" rx="2" fill="#2563eb"/>
  <text x="40" y="303" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1e293b">Samsung 4K TV 55"</text>
  <text x="24" y="318" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#94a3b8">2 × ₹22,900</text>
  <text x="336" y="318" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1e293b">₹45,800</text>
  <!-- Item 2 -->
  <rect x="14" y="350" width="332" height="58" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="362" width="8" height="8" rx="2" fill="#10b981"/>
  <text x="40" y="371" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1e293b">LG Refrigerator 320L</text>
  <text x="24" y="386" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#94a3b8">1 × ₹28,500</text>
  <text x="336" y="386" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1e293b">₹28,500</text>
  <!-- Item 3 -->
  <rect x="14" y="418" width="332" height="58" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="430" width="8" height="8" rx="2" fill="#f59e0b"/>
  <text x="40" y="439" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1e293b">Washing Machine 8kg</text>
  <text x="24" y="454" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#94a3b8">1 × ₹15,500</text>
  <text x="336" y="454" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1e293b">₹15,500</text>
  <!-- Totals box -->
  <rect x="14" y="490" width="332" height="122" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="512" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">Subtotal</text>
  <text x="336" y="512" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">₹89,800</text>
  <line x1="28" y1="520" x2="332" y2="520" stroke="#f1f5f9" stroke-width="1"/>
  <text x="28" y="537" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">GST (18%)</text>
  <text x="336" y="537" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">₹16,164</text>
  <line x1="28" y1="545" x2="332" y2="545" stroke="#f1f5f9" stroke-width="1"/>
  <text x="28" y="562" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b">Discount</text>
  <text x="336" y="562" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a">- ₹5,000</text>
  <line x1="28" y1="572" x2="332" y2="572" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="28" y="591" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1e293b">Total</text>
  <text x="336" y="592" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2563eb">₹1,00,964</text>
  <text x="28" y="604" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#94a3b8">Including all taxes</text>
  <!-- Action buttons -->
  <rect x="14" y="628" width="156" height="44" rx="10" fill="#0f172a"/>
  <text x="92" y="654" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#fff">Share</text>
  <rect x="180" y="628" width="166" height="44" rx="10" fill="#2563eb"/>
  <text x="263" y="654" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#fff">Print Invoice</text>
  <!-- Bottom nav -->
  <rect x="0" y="694" width="360" height="66" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="726" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#94a3b8">⊞</text>
  <text x="40" y="742" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#94a3b8">Home</text>
  <text x="110" y="726" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#94a3b8">◫</text>
  <text x="110" y="742" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#94a3b8">Orders</text>
  <rect x="160" y="708" width="40" height="40" rx="20" fill="#2563eb"/>
  <text x="180" y="732" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#fff">+</text>
  <text x="250" y="726" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#2563eb">◙</text>
  <text x="250" y="742" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="600" fill="#2563eb">Billing</text>
  <text x="320" y="726" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#94a3b8">☰</text>
  <text x="320" y="742" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#94a3b8">More</text>
</svg>
